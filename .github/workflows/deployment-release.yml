name: Publish Linux deployment bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: Validate public images and publish source-free bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out this exact public release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Confirm versioned images are anonymously pullable
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker pull "ghcr.io/troainc/bifrost-control-plane:$VERSION"
          docker pull "ghcr.io/troainc/bifrost-web:$VERSION"

      - name: Create and validate the source-free bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bifrost-controller-$VERSION"
          mkdir -p "$stage/config" "$stage/secrets"
          cp install.sh "$stage/install.sh"
          cp .env.example "$stage/.env.example"
          cp deployment/compose.yaml "$stage/compose.yaml"
          cp deployment/config/* "$stage/config/"
          control_digest="$(docker image inspect "ghcr.io/troainc/bifrost-control-plane:$VERSION" --format '{{index .RepoDigests 0}}')"
          web_digest="$(docker image inspect "ghcr.io/troainc/bifrost-web:$VERSION" --format '{{index .RepoDigests 0}}')"
          [[ "$control_digest" =~ ^ghcr\.io/troainc/bifrost-control-plane@sha256:[a-f0-9]{64}$ ]]
          [[ "$web_digest" =~ ^ghcr\.io/troainc/bifrost-web@sha256:[a-f0-9]{64}$ ]]
          sed -i "s|^BIFROST_VERSION=.*|BIFROST_VERSION=$VERSION|; s|^BIFROST_CONTROL_PLANE_IMAGE=.*|BIFROST_CONTROL_PLANE_IMAGE=$control_digest|; s|^BIFROST_WEB_IMAGE=.*|BIFROST_WEB_IMAGE=$web_digest|" "$stage/.env.example"
          sed -i "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"$VERSION\"|" "$stage/install.sh"
          cp "$stage/.env.example" "$stage/.env"
          touch "$stage/secrets/postgres_owner_password.txt" "$stage/secrets/bifrost_app_password.txt" \
            "$stage/secrets/rate_limit_pepper.txt" "$stage/secrets/license_signing_public.pem" \
            "$stage/secrets/mfa_encryption_key.txt" "$stage/secrets/agent-job-signing-private.pem"
          (cd "$stage" && BIFROST_PUBLIC_URL=https://panel.example.invalid \
            BIFROST_TRUSTED_PROXIES=127.0.0.1,::1,10.240.0.10 BIFROST_PRIVATE_SUBNET=10.240.0.0/24 \
            BIFROST_WEB_NETWORK_IP=10.240.0.10 BIFROST_PRIVACY_CONTROLLER_NAME=CI \
            BIFROST_PRIVACY_CONTACT=privacy@example.invalid BIFROST_PRIVACY_JURISDICTIONS=CI \
            BIFROST_PRIVACY_LAWFUL_BASES=CI BIFROST_PRIVACY_PROCESSORS=CI BIFROST_PRIVACY_DATA_REGION=CI \
            BIFROST_PRIVACY_REVIEW_APPROVED_AT=2026-01-01 BIFROST_PRIVACY_REVIEW_REFERENCE=CI \
            docker compose -f compose.yaml config --quiet)
          rm -rf "$stage/secrets" "$stage/.env"
          bundle="bifrost-controller-linux-amd64-$VERSION.tar.gz"
          tar -C "$stage" -czf "$RUNNER_TEMP/$bundle" .
          cp "$stage/install.sh" "$RUNNER_TEMP/install.sh"
          (cd "$RUNNER_TEMP" && sha256sum "$bundle" install.sh > SHA256SUMS)
          printf 'Version: %s\nControl-plane: %s\nWeb: %s\n' "$VERSION" "$control_digest" "$web_digest" > "$RUNNER_TEMP/IMAGE-LOCK.txt"

      - name: Publish deployment-test release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "$RUNNER_TEMP/bifrost-controller-linux-amd64-$VERSION.tar.gz" \
            "$RUNNER_TEMP/install.sh" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/IMAGE-LOCK.txt" \
            --title "Bifrost Linux deployment test $VERSION" \
            --notes "Debian/Ubuntu amd64 deployment-test bundle. The Controller images are pinned by digest in the bundle. This is not production approval, publisher signing, or Linux VM acceptance. See the VM Deployment Test Plan in the public repository."
