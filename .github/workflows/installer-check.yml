name: Check customer installer configuration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check shell syntax without installing
        run: bash -n install.sh && bash -n update.sh
      - name: Check license URL and key rejection using temporary files
        run: python3 -m unittest discover -s tests -v
