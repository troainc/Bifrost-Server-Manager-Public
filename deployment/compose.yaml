services:
  postgres:
    image: postgres:17.6-bookworm
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: bifrost
      POSTGRES_USER: bifrost_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      BIFROST_APP_PASSWORD_FILE: /run/secrets/bifrost_app_password
    secrets: [postgres_owner_password, bifrost_app_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init-db-role.sh:/docker-entrypoint-initdb.d/09-bifrost-app-role.sh:ro
      - ./config/10-bifrost-app-role.sql:/etc/10-bifrost-app-role.sql:ro
    networks: [private]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost_owner -d bifrost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  migrate:
    image: ${BIFROST_CONTROL_PLANE_IMAGE}
    pull_policy: never
    command: ["node", "dist/migrate.js"]
    environment:
      DB_PASSWORD_FILE: /run/secrets/postgres_owner_password
      DB_HOST: postgres:5432
      DB_NAME: bifrost
      DB_USER: bifrost_owner
    secrets: [postgres_owner_password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]
    restart: "no"
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  control-plane:
    image: ${BIFROST_CONTROL_PLANE_IMAGE}
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: ${BIFROST_PUBLIC_URL:?Set BIFROST_PUBLIC_URL to the external HTTPS URL}
      DB_PASSWORD_FILE: /run/secrets/bifrost_app_password
      DB_HOST: postgres:5432
      DB_NAME: bifrost
      DB_USER: bifrost_app
      TRUSTED_PROXIES: ${BIFROST_TRUSTED_PROXIES:?Set the TLS proxy and Controller network addresses}
      RATE_LIMIT_PEPPER_FILE: /run/secrets/rate_limit_pepper
      BIFROST_LICENSE_URL: ${BIFROST_LICENSE_URL:-}
      BIFROST_LICENSE_PUBLIC_KEY_FILE: /run/bifrost/license-signing-public.pem
      BIFROST_PRIVACY_CONTROLLER_NAME: ${BIFROST_PRIVACY_CONTROLLER_NAME:-}
      BIFROST_PRIVACY_CONTACT: ${BIFROST_PRIVACY_CONTACT:-}
      BIFROST_PRIVACY_JURISDICTIONS: ${BIFROST_PRIVACY_JURISDICTIONS:-}
      BIFROST_PRIVACY_LAWFUL_BASES: ${BIFROST_PRIVACY_LAWFUL_BASES:-}
      BIFROST_PRIVACY_PROCESSORS: ${BIFROST_PRIVACY_PROCESSORS:-}
      BIFROST_PRIVACY_DATA_REGION: ${BIFROST_PRIVACY_DATA_REGION:-}
      BIFROST_PRIVACY_REVIEW_APPROVED_AT: ${BIFROST_PRIVACY_REVIEW_APPROVED_AT:-}
      BIFROST_PRIVACY_REVIEW_REFERENCE: ${BIFROST_PRIVACY_REVIEW_REFERENCE:-}
      BIFROST_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      BIFROST_AGENT_JOB_SIGNING_PRIVATE_KEY_FILE: /run/secrets/agent_job_signing_private
      BIFROST_BRANDING_DIR: /var/lib/bifrost/branding
      MFA_REQUIRED_ADMINS: "true"
    secrets: [bifrost_app_password, rate_limit_pepper, mfa_encryption_key, agent_job_signing_private]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [private, control-plane-egress]
    volumes:
      - branding_data:/var/lib/bifrost/branding
      - ./config/license-signing-public.pem:/run/bifrost/license-signing-public.pem:ro
      - ./config/runtime-profile-catalog.example.json:/run/bifrost/runtime-profiles.json:ro
      - ./config/runtime-profile-trust.example.json:/run/bifrost/runtime-profile-trust.json:ro
      - ./config/migration-target-policies.example.json:/run/bifrost/migration-target-policies.json:ro
      - ./config/extensions.example.json:/run/bifrost/extensions.json:ro
      - ./config/extension-trust.example.json:/run/bifrost/extension-trust.json:ro
      - ./config/extension-policy.example.json:/run/bifrost/extension-policy.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "${BIFROST_API_CPU_LIMIT:-2.0}"
          memory: "${BIFROST_API_MEMORY_LIMIT:-1G}"
          pids: 256
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
  web:
    image: ${BIFROST_WEB_IMAGE}
    pull_policy: never
    restart: unless-stopped
    ports: ["${BIFROST_HTTP_BIND:-127.0.0.1}:${BIFROST_HTTP_PORT:-8080}:8080"]
    depends_on:
      control-plane: {condition: service_healthy}
    networks:
      edge: {}
      private:
        ipv4_address: ${BIFROST_WEB_NETWORK_IP:?Set an unused fixed web address in the private network}
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "${BIFROST_WEB_CPU_LIMIT:-0.50}"
          memory: "${BIFROST_WEB_MEMORY_LIMIT:-256M}"
          pids: 128
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
  https:
    image: ${BIFROST_WEB_IMAGE}
    pull_policy: never
    restart: unless-stopped
    ports: ["${BIFROST_HTTPS_PORT:-8443}:8443"]
    volumes: ["./config/https.conf:/etc/nginx/conf.d/default.conf:ro"]
    secrets: [panel_certificate, panel_key]
    networks: [edge]
    depends_on:
      web: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,mode=1777", "/var/cache/nginx:rw,mode=1777", "/var/run:rw,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/api/health/live"]
      interval: 10s
      retries: 12
      start_period: 20s
networks:
  edge: {}
  control-plane-egress: {}
  private:
    internal: true
    ipam:
      config:
        - subnet: ${BIFROST_PRIVATE_SUBNET:?Choose an unused private Docker subnet}
volumes:
  postgres_data:
  branding_data:
secrets:
  panel_certificate:
    file: ./secrets/panel-cert.pem
  panel_key:
    file: ./secrets/panel-key.pem
  postgres_owner_password:
    file: ./secrets/postgres_owner_password.txt
  bifrost_app_password:
    file: ./secrets/bifrost_app_password.txt
  rate_limit_pepper:
    file: ./secrets/rate_limit_pepper.txt
  mfa_encryption_key:
    file: ./secrets/mfa_encryption_key.txt
  agent_job_signing_private:
    file: ./secrets/agent-job-signing-private.pem

